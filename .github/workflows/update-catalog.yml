name: Actualizar catálogo

on:
  schedule:
    - cron: "0 11 * * *" # 6:00 am hora Perú (UTC-5)
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obtener productos desde NuSkin
        run: node scripts/fetch-products.mjs

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git diff --staged --quiet || git commit -m "Actualizar catálogo de productos"
          git push
